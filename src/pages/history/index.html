<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>History</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <main>
    <header class="head">
      <h1>History</h1>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="search" type="search" placeholder="Search history" spellcheck="false" autocomplete="off">
        </label>
        <button class="btn" id="clearAll">Clear all</button>
      </div>
    </header>
    <p class="count" id="count"></p>
    <div id="list"></div>
    <div id="more"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
  <script src="history.js"></script>
</body>
</html>
