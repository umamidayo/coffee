<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Coffee</title>
  <link rel="stylesheet" href="../pages/shared/theme.css">
  <link rel="stylesheet" href="tabstrip.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header id="topbar" class="drag">
    <div class="nav no-drag">
      <button id="back" class="icon-btn" aria-label="Back"></button>
      <button id="forward" class="icon-btn" aria-label="Forward"></button>
      <button id="reload" class="icon-btn" aria-label="Reload"></button>
      <button id="home" class="icon-btn" aria-label="Home" title="Home" hidden></button>
    </div>

    <div id="omnibox" class="no-drag">
      <span id="omni-private" hidden></span>
      <button id="omni-shield" class="omni-icon" aria-label="Ad blocking"></button>
      <div id="omni-field">
        <div id="omni-display"></div>
        <input id="omni-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      </div>
      <button id="omni-zoom" class="omni-pill" hidden></button>
      <button id="omni-pip" class="omni-icon" aria-label="Pop out video" title="Pop out video (Alt+P)" hidden></button>
      <button id="omni-star" class="omni-icon" aria-label="Bookmark this page"></button>

      <div id="find" hidden>
        <span class="find-icon"></span>
        <input id="find-input" type="text" spellcheck="false" placeholder="Find in page">
        <span id="find-count"></span>
        <button id="find-prev" class="omni-icon" aria-label="Previous match"></button>
        <button id="find-next" class="omni-icon" aria-label="Next match"></button>
        <button id="find-close" class="omni-icon" aria-label="Close find"></button>
      </div>
    </div>

    <div class="actions no-drag">
      <button id="update-btn" hidden title="A new version of Coffee is ready">Restart to update</button>
      <div id="ext-actions" hidden></div>
      <button id="bookmarks-btn" class="icon-btn" aria-label="Bookmarks" title="Bookmarks" hidden></button>
      <button id="ext-btn" class="icon-btn" aria-label="Extensions" hidden></button>
      <button id="downloads-btn" class="icon-btn" aria-label="Downloads">
        <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/></svg>
      </button>
      <button id="menu-btn" class="icon-btn" aria-label="Menu"></button>
    </div>

    <div class="winctl no-drag">
      <button id="win-min" aria-label="Minimize"></button>
      <button id="win-max" aria-label="Maximize"></button>
      <button id="win-close" aria-label="Close"></button>
    </div>
  </header>

  <nav id="bookmarks-bar"></nav>

  <!-- Tabs on top (Settings: tab position = top) -->
  <div id="tabstrip" class="drag">
    <div id="htabs-scroll">
      <div id="htabs"><button id="new-tab-top" class="strip-btn" aria-label="New tab"></button></div>
    </div>
  </div>

  <!-- Tabs on the side (default). In compact mode this is hidden and a
       peek panel slides out over the page from the left edge instead. -->
  <aside id="sidebar">
    <div id="tabs-scroll">
      <div id="tabs"></div>
      <button id="new-tab" class="side-btn" aria-label="New tab"></button>
    </div>
    <div class="side-bottom">
      <button id="settings-btn" class="side-btn" aria-label="Settings"></button>
    </div>
  </aside>

  <div id="loading-bar"><div class="fill"></div></div>
  <main id="page-slot"></main>

  <!-- Split view: the pages sit above this document, so these show only in
       the gaps the main process leaves: a bar over each half (accented over
       the active one) and a divider to drag between them. -->
  <div id="split" hidden>
    <div id="split-bar-left" class="split-bar"></div>
    <div id="split-bar-right" class="split-bar"></div>
    <div id="split-divider" title="Drag to resize · double-click to reset"><span></span></div>
  </div>

  <script src="icons.js"></script>
  <script src="tabstrip.js"></script>
  <script src="ui.js"></script>
</body>
</html>
